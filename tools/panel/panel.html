<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EduZone Panel</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
:root{--b950:#06190f;--b900:#0a2a1d;--b800:#0e3a28;--b700:#124a33;--b500:#23805a;--b100:#d8ece0;--b50:#edf6f0;--gold:#d4a03f;--gold3:#ecd08f;--gold1:#f8eed4;--goldt:#8a5f12;
--bg:#faf8f3;--card:#fff;--sunk:#f2eee4;--line:#e5dfd2;--line2:#cfc6b4;--text:#14201a;--muted:#5c6862;--subtle:#7d877f;
--ok:#17703f;--okbg:#e3f3e8;--warn:#9a5b00;--warnbg:#fdf0d6;--bad:#b42318;--badbg:#fdecea;--info:#1c5f8f;--infobg:#e5f0f8;
--serif:"Fraunces",Georgia,"Times New Roman",serif;--sans:"Instrument Sans","Segoe UI",system-ui,sans-serif;--mono:"Cascadia Mono",Consolas,monospace}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:15px/1.5 var(--sans);color:var(--text);background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--b500);outline-offset:2px}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
aside{background:var(--b950);color:#fbfaf5;padding:22px 14px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:11px;padding:0 8px;font-family:var(--serif);font-size:20px;font-weight:600}
.brand img{width:30px;height:34px}
.brand small{display:block;font:600 11px/1 var(--sans);color:var(--gold3);letter-spacing:.04em;margin-top:4px}
nav{display:flex;flex-direction:column;gap:3px}
nav button{display:flex;align-items:center;gap:11px;border:0;background:none;color:rgba(216,236,224,.8);padding:10px 12px;border-radius:10px;text-align:left;font-weight:600}
nav button:hover{background:var(--b900);color:#fff}
nav button[aria-current=page]{background:var(--b800);color:#fff}
nav svg{width:18px;height:18px;flex:none}
nav .n{margin-left:auto;background:var(--gold);color:var(--b950);border-radius:99px;font-size:12px;padding:1px 8px;font-weight:700}
nav .n.bad{background:#e5695e;color:#fff}
aside .foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;font-size:13px;color:rgba(216,236,224,.65)}
aside .foot button{border:1px solid rgba(255,255,255,.18);background:none;color:#fbfaf5;border-radius:10px;padding:8px 12px;font-weight:600}
aside .foot button:hover{background:var(--b900)}
main{padding:28px 34px 60px;max-width:1120px;width:100%}
h1{font:600 30px/1.15 var(--serif);letter-spacing:-.02em;margin:0}
h2{font:600 20px/1.2 var(--serif);letter-spacing:-.01em;margin:0}
.lead{color:var(--muted);margin:5px 0 0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.btn{border:1px solid var(--line2);background:var(--card);border-radius:11px;padding:9px 16px;font-weight:600;min-height:40px;display:inline-flex;align-items:center;gap:8px}
.btn:hover{background:var(--sunk)}
.btn.p{background:var(--b700);border-color:var(--b700);color:#fbfaf5}.btn.p:hover{background:var(--b800)}
.btn.d{color:var(--bad);border-color:#efc4bf}.btn.d:hover{background:var(--badbg)}
.btn.s{min-height:34px;padding:5px 12px;font-size:14px;border-radius:9px}
.btn:disabled{opacity:.5;cursor:default}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 1px 2px rgba(20,32,26,.05)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}
.svc{display:flex;flex-direction:column;gap:14px}
.svc .top{display:flex;align-items:center;gap:12px}
.dot{width:12px;height:12px;border-radius:50%;flex:none;background:var(--line2)}
.dot.running,.dot.external{background:#2e9e63}
.dot.starting,.dot.stopping{background:var(--gold);animation:pulse 1.1s infinite}
.dot.failed{background:var(--bad)}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.svc b{font-size:17px}
.meta{font-size:13px;color:var(--muted)}
.pill{font-size:12px;font-weight:700;border-radius:99px;padding:3px 10px;background:var(--sunk);color:var(--muted)}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.warn{background:var(--warnbg);color:var(--warn)}.pill.bad{background:var(--badbg);color:var(--bad)}.pill.info{background:var(--infobg);color:var(--info)}
.note{border-radius:12px;padding:11px 14px;font-size:14px;background:var(--warnbg);color:var(--warn);border:1px solid rgba(154,91,0,.18)}
.note.bad{background:var(--badbg);color:var(--bad);border-color:rgba(180,35,24,.2)}
.code-hero{background:var(--b900);color:#fbfaf5;border-radius:22px;padding:26px 28px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:22px;align-items:center}
.code-hero .num{font:600 58px/1 var(--mono);letter-spacing:.12em;color:#fff}
.code-hero .who{color:var(--b100);font-size:15px}
.code-hero .who b{color:#fff}
.code-hero .bar{height:6px;border-radius:9px;background:rgba(255,255,255,.14);margin-top:16px;overflow:hidden}
.code-hero .bar i{display:block;height:100%;background:var(--gold)}
.code-hero.old{background:#3c4a43}.code-hero.old .num{color:rgba(255,255,255,.55);text-decoration:line-through}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--b950);font-size:16px;min-height:48px;padding:10px 24px}.btn.gold:hover{background:var(--gold3)}
.list{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.list li{padding:13px 18px;border-top:1px solid var(--line);display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.list li:first-child{border-top:0}
.list .grow{flex:1;min-width:180px}
.mono{font-family:var(--mono);font-weight:600;font-size:19px;letter-spacing:.08em}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.steps>div{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:13px 15px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.steps small{flex:0 0 100%;font-weight:700;color:var(--muted);font-size:12.5px}
.empty{border:1px dashed var(--line2);border-radius:18px;padding:44px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;font:600 19px var(--serif);color:var(--text);margin-bottom:4px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line2);background:var(--card);border-radius:99px;padding:6px 14px;font-weight:600;font-size:14px;color:var(--muted)}
.tabs button[aria-pressed=true]{background:var(--b800);border-color:var(--b800);color:#fff}
.log{background:#0b1712;color:#d5e4da;border-radius:16px;padding:14px 16px;height:min(62vh,620px);overflow:auto;font:13px/1.55 var(--mono);white-space:pre-wrap;word-break:break-word}
.log div.bad{color:#ffb4a8;background:rgba(180,35,24,.22);margin:0 -16px;padding:0 16px}
.log time{color:#6f8a7b;margin-right:10px}
input[type=search]{border:1px solid var(--line2);border-radius:11px;padding:8px 13px;min-height:40px;background:#fff;min-width:200px}
pre.mail{white-space:pre-wrap;word-break:break-word;font:14px/1.6 var(--sans);background:var(--bg);border-radius:12px;padding:14px 16px;margin:10px 0 0;width:100%}
details{width:100%}summary{cursor:pointer;list-style:none}summary::-webkit-details-marker{display:none}
.sw{display:flex;gap:14px;align-items:center;justify-content:space-between;padding:14px 0;border-top:1px solid var(--line)}
.sw:first-of-type{border-top:0}
.sw input{width:44px;height:24px;appearance:none;background:var(--line2);border-radius:99px;position:relative;flex:none;cursor:pointer;margin:0}
.sw input:before{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;left:3px;top:3px;transition:left .15s}
.sw input:checked{background:var(--b500)}.sw input:checked:before{left:23px}
#toast{position:fixed;right:24px;bottom:24px;background:var(--b900);color:#fff;border-radius:12px;padding:12px 18px;font-weight:600;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none}
#toast.on{opacity:1;transform:none}
#gone{display:none;position:fixed;inset:0;background:rgba(6,25,15,.82);color:#fff;place-items:center;text-align:center;padding:24px;z-index:9}
#gone.on{display:grid}
@media (max-width:820px){.app{grid-template-columns:1fr}aside{position:static;height:auto;gap:14px}nav{flex-direction:row;flex-wrap:wrap}aside .foot{margin:0}main{padding:20px 16px 50px}.code-hero{grid-template-columns:1fr}.code-hero .num{font-size:42px}}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><img src="/icon.svg" alt="" onerror="this.remove()"><span>EduZone<small>Development only</small></span></div>
    <nav id="nav"></nav>
    <div class="foot"><span>Test tool for this computer. It never goes to the live site.</span><span>Closing this window keeps everything running.</span><button id="quit">Stop all and quit</button></div>
  </aside>
  <main id="main"></main>
</div>
<div id="toast" role="status"></div>
<div id="gone"><div><h1>The panel has closed</h1><p>Double-click “EduZone Panel” to open it again.</p></div></div>
<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const icon = (d) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const PAGES = [
  ["home", "System", icon('<rect x="3" y="4" width="18" height="6" rx="2"/><rect x="3" y="14" width="18" height="6" rx="2"/><path d="M7 7h.01M7 17h.01"/>')],
  ["codes", "Mobile codes", icon('<rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/>')],
  ["mail", "Emails", icon('<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>')],
  ["people", "Test accounts", icon('<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>')],
  ["logs", "Logs", icon('<path d="M4 6h16M4 12h10M4 18h13"/>')],
  ["tools", "Tools", icon('<path d="M14.7 6.3a4 4 0 0 0-5.4 5.2L3 17.8 6.2 21l6.3-6.3a4 4 0 0 0 5.2-5.4l-2.6 2.6-2.4-2.4z"/>')],
];
const CODE_LIFE = 5 * 60_000;
let page = location.hash.slice(1) || "home", S = null, acc = null, seen = null, sound = localStorage.getItem("ez-sound") !== "off";
let admin = null;
let logSvc = "api", logAfter = 0, logLines = [], logFind = "", logBad = false, missed = 0;

async function post(p) {
  try { await fetch("/api/" + p, { method: "POST", headers: { "x-eduzone-panel": "1" } }); } catch {}
  tick();
}
function toast(m) { const el = $("#toast"); el.textContent = m; el.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("on"), 1800); }
async function copy(text, label) { try { await navigator.clipboard.writeText(text); toast(label + " copied"); } catch { toast("Couldn't copy"); } }

// --- messages
const person = (phone) => (acc?.people ?? []).find((p) => p.phone === phone);
const codeOf = (m) => /\b(\d{6})\b/.exec(m.message)?.[1] ?? "";
function purpose(m) {
  const t = m.message.toLowerCase();
  if (t.includes("admin")) return "Admin sign-in";
  if (t.includes("new device")) return "Sign-in on a new device";
  if (t.includes("recover") || t.includes("password") && !t.includes("change your password")) return "Password recovery";
  return "Phone confirmation";
}
const localPhone = (p) => (p ?? "").replace(/^\+94(\d{2})(\d{3})(\d{4})$/, "0$1 $2 $3");
const ago = (iso) => { const s = Math.max(0, Math.round((Date.now() - new Date(iso)) / 1000)); return s < 60 ? s + " s ago" : s < 3600 ? Math.floor(s / 60) + " min ago" : new Date(iso).toLocaleString([], { dateStyle: "medium", timeStyle: "short" }); };
const leftMs = (m) => new Date(m.at).getTime() + CODE_LIFE - Date.now();
const mmss = (ms) => `${Math.floor(ms / 60000)}:${String(Math.floor(ms / 1000) % 60).padStart(2, "0")}`;
function beep() { if (!sound) return; try { const a = new AudioContext(), o = a.createOscillator(), g = a.createGain(); o.frequency.value = 880; g.gain.value = .06; o.connect(g).connect(a.destination); o.start(); o.stop(a.currentTime + .14); } catch {} }

// --- pages
const word = { running: "Running", external: "Running (started elsewhere)", starting: "Starting…", stopping: "Stopping…", stopped: "Stopped", failed: "Failed" };
const pillOf = { running: "ok", external: "info", starting: "warn", stopping: "warn", stopped: "", failed: "bad" };
const says = { db: "Keeps all the data", api: "The engine: rules, payments, codes", web: "Marketplace, students and teachers", admin: "EduZone staff only" };
function home() {
  const up = S.services.filter((s) => s.up).length, all = up === S.services.length, none = up === 0;
  const api = S.services.find((s) => s.id === "api");
  const latest = S.sms.find((m) => codeOf(m) && leftMs(m) > 0);
  return `<div class="spread"><div><h1>${S.busy ? esc(S.busy) + "…" : all ? "Everything is running" : none ? "EduZone is stopped" : up + " of 4 parts are running"}</h1>
    <p class="lead">Database updates: ${{ ok: "", unknown: "checked when you start", running: "running…", failed: "failed. " }[S.migration.status]}${esc(S.migration.message)}</p></div>
    <div class="row"><button class="btn p" data-post="start-all" ${S.busy || all ? "disabled" : ""}>Start everything</button>
    <button class="btn d" data-post="stop-all" ${S.busy || none ? "disabled" : ""}>Stop everything</button></div></div>
  ${api.phase === "external" ? `<p class="note">The API was started outside this panel, so its codes and emails don't come here. <button class="btn s" data-post="restart/api">Restart it here</button></p>` : ""}
  ${latest ? hero(latest) : ""}
  <div class="grid g2">${S.services.map((s) => `<section class="card svc">
    <div class="top"><span class="dot ${s.phase}"></span><div style="flex:1"><b>${esc(s.name)}</b><div class="meta">${says[s.id]} · port ${s.port}</div></div><span class="pill ${pillOf[s.phase]}">${word[s.phase]}</span></div>
    ${s.error ? `<p class="note bad" style="margin:0">${esc(s.error)}</p>` : ""}
    <div class="row">${s.up || s.phase === "starting" ? `${s.url ? `<a class="btn s" style="text-decoration:none;color:inherit" target="_blank" href="${s.url}">Open</a>` : ""}
      <button class="btn s" data-post="restart/${s.id}" ${S.busy ? "disabled" : ""}>Restart</button><button class="btn s d" data-post="stop/${s.id}" ${S.busy ? "disabled" : ""}>Stop</button>`
      : `<button class="btn s p" data-post="start/${s.id}" ${S.busy || s.phase === "stopping" ? "disabled" : ""}>Start</button>`}
      <button class="btn s" data-log="${s.id}">Log${s.errors ? ` <span class="pill bad">${s.errors}</span>` : ""}</button>
      ${s.since && s.phase === "running" ? `<span class="meta" style="margin-left:auto">up ${upFor(s.since)}</span>` : ""}</div></section>`).join("")}</div>`;
}
const upFor = (t) => { const m = Math.floor((Date.now() - t) / 60000); return m < 1 ? "just now" : m < 60 ? m + " min" : Math.floor(m / 60) + " h " + (m % 60) + " min"; };
function hero(m) {
  const left = leftMs(m), p = person(m.phone), code = codeOf(m);
  return `<section class="code-hero ${left > 0 ? "" : "old"}"><div><div class="num" aria-label="Code ${esc(code)}">${esc(code)}</div>
    <p class="who" style="margin:12px 0 0"><b>${esc(purpose(m))}</b> · ${esc(localPhone(m.phone))}${p ? ` · ${esc(p.name)} (${esc(p.role.toLowerCase())})` : ""} · ${left > 0 ? `<b>${mmss(left)}</b> left` : "expired"}</p>
    <div class="bar"><i style="width:${Math.max(0, left / CODE_LIFE * 100)}%"></i></div></div>
    <button class="btn gold" data-copy="${esc(code)}" data-label="Code">Copy code</button></section>`;
}
function codes() {
  const list = S.sms, first = list.find((m) => codeOf(m));
  return `<div class="spread"><div><h1>Mobile codes</h1><p class="lead">Every SMS the system sends shows here at once. Nothing goes to a real phone.</p></div>
    <div class="row"><button class="btn s" data-sound>${sound ? "Sound on" : "Sound off"}</button><button class="btn s" data-post="clear-messages" ${list.length || S.emails.length ? "" : "disabled"}>Clear codes and emails</button></div></div>
  ${first ? hero(first) : `<div class="empty"><b>No codes yet</b>Sign in on the website or register, and the code appears here.</div>`}
  ${adminCard()}
  ${list.length > 1 ? `<h2>Earlier messages</h2><ul class="list">${list.slice(1).map((m) => { const c = codeOf(m), p = person(m.phone); return `<li><span class="mono" style="${leftMs(m) > 0 ? "" : "color:var(--subtle)"}">${esc(c || "SMS")}</span>
    <div class="grow"><b>${esc(c ? purpose(m) : "Message")}</b><div class="meta">${esc(localPhone(m.phone))}${p ? " · " + esc(p.name) : ""}${c ? "" : " · " + esc(m.message)}</div></div>
    <span class="pill ${leftMs(m) > 0 ? "ok" : ""}">${leftMs(m) > 0 ? mmss(leftMs(m)) + " left" : "expired"}</span><span class="meta">${ago(m.at)}</span>
    ${c ? `<button class="btn s" data-copy="${esc(c)}" data-label="Code">Copy</button>` : ""}</li>`; }).join("")}</ul>` : ""}`;
}
/** Everything the admin app asks for, in its order. Only while this page is open. */
function adminCard() {
  const head = `<div class="spread" style="align-items:center"><div><h2>Admin app sign-in</h2><p class="meta" style="margin:3px 0 0">It asks for the mobile number, then the SMS code, then the authenticator code.</p></div>
    <a class="btn s" style="text-decoration:none;color:inherit" target="_blank" href="http://localhost:3001">Open admin app</a></div>`;
  if (!admin) return `<section class="card grid">${head}<p class="meta" style="margin:0">Reading…</p></section>`;
  if (admin.error) return `<section class="card grid">${head}<p class="note" style="margin:0">${esc(admin.error)}</p></section>`;
  if (!admin.admins.length) return `<section class="card grid">${head}<p class="meta" style="margin:0">There is no local admin yet.</p><div><button class="btn p" data-post="tool/make_admin">Create the local admin</button></div></section>`;
  return `<section class="card grid">${head}${admin.admins.map((a) => {
    const plain = localPhone(a.phone).replace(/ /g, ""), sms = S.sms.find((m) => m.phone === a.phone && codeOf(m) && leftMs(m) > 0), left = a.valid_until - Date.now();
    return `<div class="steps"><div><small>1 · Mobile number</small><span class="mono">${esc(localPhone(a.phone))}</span><button class="btn s" data-copy="${esc(plain)}" data-label="Mobile number">Copy</button></div>
    <div><small>2 · SMS code</small>${sms ? `<span class="mono">${esc(codeOf(sms))}</span><button class="btn s p" data-copy="${esc(codeOf(sms))}" data-label="SMS code">Copy</button>` : `<span class="meta">Appears here after you enter the number</span>`}</div>
    <div><small>3 · Authenticator code</small>${a.code && left > 0 ? `<span class="mono">${esc(a.code)}</span><button class="btn s p" data-copy="${esc(a.code)}" data-label="Authenticator code">Copy</button><span class="meta">works once, for ${mmss(left)}</span>` : `<span class="meta">A new one in a few seconds…</span>`}</div></div>`;
  }).join("")}</section>`;
}
async function pullAdmin() {
  if (page !== "codes" && page !== "people") { admin = null; return; }
  try { admin = await (await fetch("/api/admin-codes", { headers: { "x-eduzone-panel": "1" } })).json(); draw(); } catch {}
}
const openMail = new Set();
function mail() {
  const link = (b) => /https?:\/\/\S+/.exec(b)?.[0];
  return `<div><h1>Emails</h1><p class="lead">Verification links, password recovery and contact messages. Nothing is really sent.</p></div>
  ${S.emails.length ? `<ul class="list">${S.emails.map((m) => { const l = link(m.body), safe = l && /^http:\/\/([a-z0-9-]+\.)?localhost:3000\//.test(l); return `<li><details data-mail="${esc(m.at)}" ${openMail.has(m.at) ? "open" : ""}><summary class="row"><div class="grow"><b>${esc(m.subject)}</b><div class="meta">to ${esc(m.to)}${m.reply_to ? " · reply to " + esc(m.reply_to) : ""}</div></div>
    <span class="meta">${ago(m.at)}</span>${safe ? `<a class="btn s p" style="text-decoration:none" target="_blank" href="${esc(l)}">Open link</a>` : ""}<button class="btn s" data-copy="${esc(l ?? m.body)}" data-label="${l ? "Link" : "Email"}">Copy ${l ? "link" : "text"}</button></summary><pre class="mail">${esc(m.body)}</pre></details></li>`; }).join("")}</ul>`
    : `<div class="empty"><b>No emails yet</b>Register, use Forgot password, or send the contact form.</div>`}`;
}
function people() {
  if (!acc) return `<h1>Test accounts</h1><p class="lead">Loading…</p>`;
  return `<div><h1>Test accounts</h1><p class="lead">Made by “Demo accounts and classes” in Tools. They all use the same test password.</p></div>
  <section class="card spread" style="align-items:center"><div><b>Password for all of them</b><div class="meta">Local test value from backend/scripts/seed_demo.py</div></div>
    <button class="btn p" data-copy="${esc(acc.password)}" data-label="Password" ${acc.password ? "" : "disabled"}>Copy password</button></section>
  <ul class="list">${acc.people.map((p) => `<li><div class="grow"><b>${esc(p.name)}</b> <span class="pill">${esc(p.role)}</span><div class="meta">${esc(p.email)} · ${esc(localPhone(p.phone))}</div></div>
    <button class="btn s" data-copy="${esc(p.email)}" data-label="Email">Copy email</button><button class="btn s" data-copy="${esc(localPhone(p.phone).replace(/ /g, ""))}" data-label="Phone">Copy phone</button></li>`).join("")}</ul>
  ${adminCard()}
  <p class="meta">The website asks for a mobile code the first time you sign in from a browser: look in Mobile codes. A student can be signed in on one device only, so use a private window to be a student and a teacher together.</p>`;
}
function logs() {
  return `<div><h1>Logs</h1><p class="lead">What each part is doing. Lines that look like errors are red.</p></div>
  <div class="spread" style="align-items:center"><div class="tabs">${S.services.map((s) => `<button data-svc="${s.id}" aria-pressed="${s.id === logSvc}">${esc(s.name)}${s.errors ? " · " + s.errors : ""}</button>`).join("")}</div>
    <div class="row"><input type="search" id="find" placeholder="Find in this log" aria-label="Find in this log" value="${esc(logFind)}"><button class="btn s" data-bad aria-pressed="${logBad}">${logBad ? "Showing errors" : "Errors only"}</button><button class="btn s" data-copylog>Copy</button></div></div>
  <div class="log" id="log" tabindex="0" aria-label="Log"></div>`;
}
function tools() {
  return `<div><h1>Tools</h1><p class="lead">Fill the local database and switch test features.</p></div>
  <section class="card"><h2>Features</h2>
    <label class="sw"><span><b>Seats</b><span class="meta" style="display:block">Teachers can limit seats and close registration. Changing it restarts the API.</span></span><input type="checkbox" data-toggle="seats" ${S.settings.seats ? "checked" : ""}></label>
    <label class="sw"><span><b>Easy codes</b><span class="meta" style="display:block">No wait between mobile codes and no hourly limit. Turn off to test the real limits. Restarts the API.</span></span><input type="checkbox" data-toggle="easy-codes" ${S.settings.easyCodes ? "checked" : ""}></label>
    <label class="sw"><span><b>Open the sites after starting</b><span class="meta" style="display:block">Website and admin app open in your browser when they're ready.</span></span><input type="checkbox" data-toggle="open-sites" ${S.settings.openSites ? "checked" : ""}></label></section>
  <section class="card grid"><h2>Demo data</h2><p class="meta" style="margin:0">Safe to run again. The database must be running.</p>
    <div class="row">${S.tools.map((x) => `<button class="btn" data-post="tool/${x.id}" ${S.job?.status === "running" || !S.services[0].up ? "disabled" : ""}>${esc(x.name)}</button>`).join("")}
    <button class="btn" data-post="migrate" ${S.services[0].up ? "" : "disabled"}>Update the database</button></div>
    ${S.job ? `<p class="${S.job.status === "failed" ? "note bad" : "meta"}" style="margin:0"><b>${esc(S.job.name)}:</b> ${{ running: "running…", ok: "done", failed: "failed" }[S.job.status]}</p>${S.job.output ? `<pre class="mail" style="margin:0;font-family:var(--mono);font-size:13px">${esc(S.job.output)}</pre>` : ""}` : ""}</section>`;
}
const VIEW = { home, codes, mail, people, logs, tools };

// --- drawing: the page is rebuilt only when its HTML changes, so nothing flickers or loses focus
let drawn = {};
function set(el, key, html) { if (drawn[key] === html) return false; drawn[key] = html; el.innerHTML = html; return true; }
function draw() {
  if (!S) return;
  const errs = S.services.reduce((a, s) => a + (s.phase === "failed" ? 1 : 0), 0);
  set($("#nav"), "nav", PAGES.map(([id, label, ic]) => `<button data-page="${id}" ${id === page ? 'aria-current="page"' : ""}>${ic}${label}${id === "codes" && missed ? `<span class="n">${missed}</span>` : ""}${id === "home" && errs ? `<span class="n bad">${errs}</span>` : ""}</button>`).join(""));
  const focus = document.activeElement?.id === "find";
  if (set($("#main"), "main", `<div class="grid" style="gap:22px">${VIEW[page]()}</div>`) && page === "logs") { paintLog(true); if (focus) { const f = $("#find"); f.focus(); f.setSelectionRange(f.value.length, f.value.length); } }
}
function paintLog(all) {
  const box = $("#log"); if (!box) return;
  const atEnd = all || box.scrollTop + box.clientHeight > box.scrollHeight - 40, q = logFind.toLowerCase();
  const show = logLines.filter((l) => (!logBad || l.bad) && (!q || l.line.toLowerCase().includes(q)));
  box.innerHTML = show.length ? show.map((l) => `<div class="${l.bad ? "bad" : ""}"><time>${new Date(l.t).toLocaleTimeString([], { hour12: false })}</time>${esc(l.line)}</div>`).join("") : `<span style="color:#6f8a7b">${logLines.length ? "Nothing matches." : "Nothing here yet. Parts started outside this panel keep their own log."}</span>`;
  if (atEnd) box.scrollTop = box.scrollHeight;
}
async function pullLog() {
  if (page !== "logs") return;
  const svc = logSvc;
  try {
    const r = await (await fetch(`/api/logs?service=${svc}&after=${logAfter}`)).json();
    if (svc !== logSvc || !r.lines.length) return;
    logAfter = r.last; logLines = [...logLines, ...r.lines].slice(-1500); paintLog();
  } catch {}
}
let fails = 0;
async function tick() {
  try {
    const next = await (await fetch("/api/state")).json();
    fails = 0; $("#gone").classList.remove("on");
    const ids = new Set(next.sms.filter(codeOf).map((m) => m.at + m.phone));
    if (seen) { const fresh = [...ids].filter((i) => !seen.has(i)).length; if (fresh) { beep(); if (page !== "codes") missed += fresh; toast("New mobile code"); document.title = "● EduZone Panel"; } }
    seen = ids; S = next; draw();
  } catch { if (++fails >= 3) $("#gone").classList.add("on"); }
}
addEventListener("focus", () => { document.title = "EduZone Panel"; });
function go(p) { page = p; location.hash = p; if (p === "codes") missed = 0; admin = null; setTimeout(pullAdmin); drawn.main = null; if (p === "logs") { logAfter = 0; logLines = []; post("clear-errors/" + logSvc); pullLog(); } draw(); }

document.addEventListener("click", (e) => {
  const b = e.target.closest("button,a"); if (!b) return;
  const d = b.dataset;
  if (d.page) go(d.page);
  else if (d.post) { if (d.post === "stop-all" && !confirm("Stop the website, admin app, API and database?")) return; b.disabled = true; post(d.post); }
  else if (d.copy !== undefined) { e.preventDefault(); copy(d.copy, d.label); }
  else if (d.log) { logSvc = d.log; go("logs"); }
  else if (d.svc) { logSvc = d.svc; logAfter = 0; logLines = []; drawn.main = null; post("clear-errors/" + logSvc); draw(); pullLog(); }
  else if ("bad" in d) { logBad = !logBad; drawn.main = null; draw(); }
  else if ("copylog" in d) copy(logLines.map((l) => l.line).join("\n"), "Log");
  else if ("sound" in d) { sound = !sound; localStorage.setItem("ez-sound", sound ? "on" : "off"); drawn.main = null; draw(); beep(); }
  else if (b.id === "quit" && confirm("Stop everything this panel started, and close it?")) { post("quit"); toast("Stopping…"); }
});
document.addEventListener("change", (e) => { const t = e.target.dataset?.toggle; if (t) post(`${t}/${e.target.checked ? "on" : "off"}`); });
document.addEventListener("input", (e) => { if (e.target.id === "find") { logFind = e.target.value; paintLog(true); } });
document.addEventListener("toggle", (e) => { const k = e.target.dataset?.mail; if (k) { e.target.open ? openMail.add(k) : openMail.delete(k); drawn.main = null; } }, true);

if (!VIEW[page]) page = "home";
fetch("/api/accounts").then((r) => r.json()).then((a) => { acc = a; drawn.main = null; draw(); }).catch(() => {});
tick(); setInterval(tick, 1000); setInterval(pullLog, 1000);
setInterval(pullAdmin, 5000); pullAdmin();
</script>
</body>
</html>
